<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <link rel="stylesheet" href="./style/style.css">
     <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
    </head>
 <body>
  <section  id="container">
      <form>
        <div class="card">
            <h1>Contact Us</h1>
            <div class="name">
                <div class="f-input" id="name1">
                    <label for="" class="first">first name *</label>
                    <input type="text">
                </div>
                <div class="f-input" id="name2">
                    <label for="" class="last">last name *</label>
                    <input type="text">
                </div>
            </div>
           <div class="f-input">
                <label for="">email address *</label>
                <input type="email">
           </div>
           <div class="f-input">
                <label for="">password  *</label>
                <input type="password" required>
           </div>
           <div class="f-input" id="mail">
                <label for="">message *</label>
                <input type="text" name="" id="">
           </div>
           <div id="box">
                <input type="checkbox">
                <label for="">I consent to being contacted by the team *</label>
           </div>
           <div>
                <button type="submit">Submit</button>
           </div>
        </div>
    </form>
  </section>
    
</body>
</html>
